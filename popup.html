<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Downloads</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="header-title">
        <svg class="header-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Arquivos para Download</span>
      </div>
      <button id="btn-refresh" class="icon-button" title="Atualizar Varredura" aria-label="Atualizar varredura de arquivos da página">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 4v6h-6"></path>
          <path d="M1 20v-6h6"></path>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>
    </header>

    <!-- Banner Toast de Status (Substituição Suave de Alert) -->
    <div id="status-toast" class="toast hidden" role="alert">
      <span id="toast-message"></span>
    </div>

    <main class="popup-content">
      <div id="loading-spinner" class="spinner-container hidden">
        <div class="spinner"></div>
        <p>Varrendo a página em busca de arquivos...</p>
      </div>

      <div id="empty-state" class="empty-state hidden">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <p>Nenhum arquivo ou botão de download identificado nesta página.</p>
      </div>

      <ul id="download-list" class="download-list"></ul>
    </main>

    <footer class="popup-footer">
      <span id="file-counter" class="file-counter">0 arquivos encontrados</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
